<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activaciones observadas · Balizas V16</title>
  <link rel="stylesheet" href="./assets/css/stats.css">
</head>
<body>
  <main>
    <a class="back-link" href="./">← Volver al mapa</a>
    <h1>Activaciones V16 observadas</h1>
    <div class="controls">
      <div class="view-options" role="group" aria-label="Vista de estadísticas">
        <button type="button" id="view-daily" aria-pressed="true">30 días / día</button>
        <button type="button" id="view-hourly" aria-pressed="false">24 horas / hora</button>
      </div>
      <label id="date-control" hidden>Fecha <input id="stats-day" type="date" required></label>
      <button id="stats-refresh" type="button" class="refresh">Actualizar</button>
    </div>

    <section class="panel" aria-labelledby="detail-title">
      <header class="panel-header">
        <div><h2 id="detail-title">Detalle diario</h2><p id="stats-range">Hora de Madrid</p></div>
        <div class="total"><span>Total observado</span><strong id="stats-total">—</strong></div>
      </header>
      <p id="stats-status" role="status">Cargando estadísticas…</p>
      <div class="table-wrap">
        <table aria-labelledby="detail-title">
          <thead id="stats-head"></thead>
          <tbody id="stats-rows"></tbody>
        </table>
      </div>
      <p id="stats-note" class="footnote"></p>
    </section>
    <p class="footnote">Hora de Madrid. El recuento incluye los eventos publicados por la DGT que ha recogido este sitio. «—» indica que no hay datos para ese valor.</p>
  </main>
  <script src="./assets/js/stats.js"></script>
</body>
</html>
